# What `ci.yml`'s Python job enforces. Nothing here is ever installed — `solver/` is a plain
# package the container copies in, not a distribution — so this file carries tool settings and
# nothing else.

[tool.ruff]
# Every tool cache lives under `.cache/`, so the repository root grows one disposable
# directory rather than one per tool. `conformance/check-conformance.sh` reads the filesystem
# rather than git, so an untracked directory at the root fails its layout rule no matter what
# `.gitignore` says — and the fewer of them there are, the less MAP.md has to account for.
cache-dir = ".cache/ruff"
# The Python already in the tree was hand-wrapped near this width, so adopting a formatter is a
# reformat rather than a rewrite. The 100-column wrap in `docs/` is a prose convention and does
# not reach code.
line-length = 120
# `runs/` is promoted Step streams — data this repository stores, not code it writes (ADR-0009).
# Named here rather than left to the absence of `.py` files under it, because the exclusion is a
# decision: a Run that ever writes a `.py` into its record must not turn the linter red for it.
# The one check `runs/` is emphatically *not* excluded from is the secret scan.
extend-exclude = ["runs"]

[tool.ruff.lint]
# Ruff's own default set, written down rather than inherited. CI installs ruff unversioned, and an
# inherited default is one a release can widen under a tree nobody has touched — which turns a
# scheduled run red for a reason no commit explains. Widening this is a deliberate edit here.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = ["tests"]
# Neither `solver/` nor `scripts/` is an installed distribution — the Solver ships as a container
# (ADR-0008) — so the import path is declared once here instead of being rebuilt inside every test
# module. The repository root is what makes `import solver` work; `scripts/` is what makes the
# hand-run checks importable beside it.
pythonpath = [".", "scripts"]
