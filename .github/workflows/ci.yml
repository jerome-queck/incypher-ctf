name: CI

# All three triggers, because this repository's check is not a pure function of its own tree —
# once real checks exist it installs from a network and can rot in place while nothing is pushed.
# Drop one only with the reason recorded in `docs/adr/`.
on:
  pull_request:
  push:
    branches: [main]
  # GitHub disables a schedule after 60 days without repository activity, and emails the Owner
  # when it does.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag, so a moved tag cannot change what runs here.
      # Dependabot is what moves these pins forward (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The two structural checks that are true of this repository from its first commit, so a
      # green tick means something before real checks exist.
      - name: CLAUDE.md is still a symlink to AGENTS.md
        run: |
          mode=$(git ls-files -s CLAUDE.md | cut -d' ' -f1)
          [ "$mode" = 120000 ] || {
            echo "CLAUDE.md has mode '${mode:-missing}', expected 120000." >&2
            echo "A regular file here drifts from AGENTS.md silently." >&2
            exit 1
          }

      - name: MAP.md exists
        run: test -f MAP.md

      # This repository's real checks go below, as further jobs in this file. What they owe —
      # what CI must prove, how the checks grow, and why none of them gets a path filter — is
      # `CODING_STANDARDS.md` §5, which is the text rather than a summary of it.
      #
      # No ruleset can *require* this check on a free private repository (ADR-0003), so red does
      # not block a merge mechanically — it blocks one by convention, and CONTRIBUTING.md says so.
