name: CI

# All three triggers, because this repository's check is not a pure function of its own tree —
# the Python jobs install their linter and test runner from a network, so this can rot in place
# while nothing is pushed. Drop one only with the reason recorded in `docs/adr/`.
on:
  pull_request:
  push:
    branches: [main]
  # GitHub disables a schedule after 60 days without repository activity, and emails the Owner
  # when it does.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

# What these jobs owe — what CI must prove, how the checks grow, and why none of them gets a path
# filter — is `CODING_STANDARDS.md` §5, which is the text rather than a summary of it. Its
# ten-minute bound is `timeout-minutes` on each job rather than a promise: the jobs run in
# parallel, so a run cannot outlast its longest one.
#
# Every job is written to pass on a tree that does not yet contain the thing it checks. A check
# that goes red on an empty glob is a check people learn to route around, and the point of these
# is to bite the moment code arrives rather than to be argued with before it does.
#
# The public-repository ruleset requires these contexts (ADR-0060). Convention remains the
# backstop: a missing or bypassed mechanism never turns red into permission to merge.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit, not a tag, so a moved tag cannot change what runs here.
      # Dependabot is what moves these pins forward (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The two structural checks that are true of this repository from its first commit, so a
      # green tick means something before real checks exist.
      - name: CLAUDE.md is still a symlink to AGENTS.md
        run: |
          mode=$(git ls-files -s CLAUDE.md | cut -d' ' -f1)
          [ "$mode" = 120000 ] || {
            echo "CLAUDE.md has mode '${mode:-missing}', expected 120000." >&2
            echo "A regular file here drifts from AGENTS.md silently." >&2
            exit 1
          }

      - name: MAP.md exists
        run: test -f MAP.md

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shellcheck ships on the runner image, so there is no version here to pin or install.
      - name: shellcheck
        run: |
          # This repository's own scripts, which is not every `.sh` in the tree. `conformance/`
          # and the two skill trees are vendored copies of somebody else's text (ADR-0002,
          # `skills-lock.json`) — a finding in one of those is not a change this repository is
          # free to make, so holding them to a linter would only ever demand a divergence.
          scripts=$(git ls-files '*.sh' ':!:conformance/' ':!:.claude/skills/' ':!:.agents/skills/')

          if [ -z "$scripts" ]; then
            echo "No shell scripts of this repository's own — nothing to check."
            exit 0
          fi

          # No `--shell`: it overrides a shebang rather than standing in for a missing one, so it
          # would read `setup-board.sh` as `sh` and bury it in false findings. Each script says
          # what it is — a shebang, or the `# shellcheck shell=sh` directive the ones invoked
          # through `sh` carry.
          echo "$scripts"
          echo "$scripts" | xargs shellcheck

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Unversioned on purpose, and the schedule at the top of this file is the other half of
      # that decision. Dependabot watches `uses:` pins and no other ecosystem here, so a version
      # written down here is one nothing would ever move; a floating tool instead announces a
      # changed rule on the Monday run rather than inside somebody's pull request. What the
      # linter enforces is pinned where it belongs — `pyproject.toml` names the rule set rather
      # than inheriting whichever one ships.
      - run: python -m pip install --disable-pip-version-check ruff

      - run: ruff check --output-format=github .

      - run: ruff format --check .

  pytest:
    name: pytest (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard:
          - foundation/state
          - authority/Board
          - autonomy/inference
          - tools/integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # `cryptography` deliberately floats here as an API-compatibility check; the image job below
      # installs and probes the actual `python3-cryptography` runtime package shipped by Docker.
      - run: python -m pip install --disable-pip-version-check cryptography pytest

      # Every shard first proves that the static semantic partition is exhaustive. A new tracked
      # test cannot silently miss CI, and a duplicate cannot spend two jobs' time. Keep the
      # ten-minute hard limit above; §5 requires splitting again rather than raising it.
      - name: test shard manifest is exact
        run: python scripts/check_test_shards.py

      - name: pytest ${{ matrix.shard }}
        run: |
          set --
          while IFS= read -r test_file; do
            set -- "$@" "$test_file"
          done < <(python scripts/check_test_shards.py --shard '${{ matrix.shard }}')
          pytest "$@"

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # **This job proves amd64. We compete on arm64** — the run-day image is built on the Mac
      # that runs it, so a Kali package present for one architecture and missing for the other
      # goes green here and fails there. Nobody should read this tick as the architecture we play
      # having been proven. ADR-0008 argues why that gap is placed rather than closed, and where
      # it gets caught: every gate Run is from a locally built image, and the `Dockerfile`'s
      # closing assertion runs in that build too.
      #
      # No QEMU cross-build, no push, and no registry authentication. What this proves is that the
      # image builds, which needs no destination and no secret — and what it catches is the
      # package list drifting from what ADR-0005's recon cascade assumes is installed.
      #
      # Ten minutes is §5's bound rather than a fitted one: an uncached `--no-cache --pull` build
      # of this file measured 18 s.
      - name: docker build
        run: docker build -t solver:ci .

      # The gate turns on a refusal that only exists at boot, so it is proved from the image
      # rather than from the tree: a container that comes up at 10:30 with one variable unset and
      # runs the whole window on a credential that was never there is silent from inside and
      # afterwards indistinguishable from bad luck. Exit 2 is the Refusal, and the sentence has to
      # name the missing value or a human at 10:15 learns nothing from it.
      - name: the Solver refuses to start with nothing set, from the built image
        run: |
          container=$(docker run -d solver:ci)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          said=
          for _attempt in 1 2 3 4 5; do
            said=$(docker logs "$container" 2>&1)
            [ -n "$said" ] && break
            sleep 1
          done
          echo "$said"
          docker stop --time 5 "$container" >/dev/null
          code=$(docker inspect --format '{{.State.ExitCode}}' "$container")
          [ "$code" = 2 ] || { echo "expected the Refusal exit code 2, got $code" >&2; exit 1; }
          case "$said" in
            *RUN_ID*) ;;
            *) echo "the refusal did not name the value that was missing" >&2; exit 1 ;;
          esac
          docker rm "$container" >/dev/null
          trap - EXIT

      # The third thing ADR-0008 bakes in. It is checked from inside because the `.dockerignore` is
      # an allowlist: a re-inclusion whose parent directory is still excluded ships nothing, and
      # nothing about the tree says so — the container refuses at 10:15 instead, for a reason
      # nobody would look for here.
      - name: every event's Board profile is baked in and reads
        run: |
          docker run --rm -i --entrypoint python3 solver:ci - <<'PY'
          from solver.profile import BOARDS, tracked

          shipped = tracked(BOARDS)
          assert shipped, f"no Board profile in {BOARDS} — the .dockerignore allowlist shipped none"
          for rules in shipped:
              assert rules.url and rules.flag_wrappers and rules.window_seconds > 0, rules
          print(f"{len(shipped)} profile(s): " + ", ".join(f"{one.event} -> {one.url}" for one in shipped))
          PY

      # The recon cascade, run in the image it will run in, over an artefact whose name lies. The
      # Python job cannot prove this and never will: the machine it runs on has a package manager
      # and `exiftool` already on it, so a cascade reaching for a tool the image does not install
      # passes there and fails at 14:00 on competition day. `tests/test_recon_cascade.py` holds the
      # branch table against the `Dockerfile`'s text, which is a proxy; this is the thing itself.
      #
      # It costs about a second on an image the step above has just built.
      - name: the recon cascade runs inside the built image
        run: |
          docker run --rm -i --entrypoint python3 solver:ci - <<'PY'
          import pathlib, zipfile
          from solver.recon import recon
          from solver.record import Recorder
          from solver.redaction import Redactor

          shed = pathlib.Path("/tmp/artefacts")
          shed.mkdir()
          png = bytes.fromhex("89504e470d0a1a0a") + b"\x00\x00\x00\rIHDR" + bytes(24)
          # The name says text, the bytes say PNG. Dispatch is on the bytes.
          (shed / "readme.txt").write_bytes(png)
          with zipfile.ZipFile(shed / "challenge.zip", "w") as writing:
              writing.writestr("inner/notes.md", "brunner{inside_the_archive}")

          found = recon(
              "The archive password is in the notes.",
              sorted(shed.iterdir()),
              flag_wrappers=(r"brunner\{[^}]*\}",),
              recorder=Recorder(pathlib.Path("/state"), run_id="ci", redactor=Redactor({})),
              attempt_id="ci-1",
          )
          by_tool = {(probe.subject, probe.tool): probe.shown for probe in found.probes}

          assert by_tool["readme.txt", "file"].strip() == "image/png", by_tool["readme.txt", "file"]
          assert "ExifTool" in by_tool["readme.txt", "exiftool"], by_tool["readme.txt", "exiftool"]
          assert "inner/notes.md" in by_tool["challenge.zip", "unzip"], by_tool["challenge.zip", "unzip"]
          assert all(probe.shown.strip() for probe in found.probes), "a probe produced no Observation"
          print(f"{len(found.probes)} probes, every one an Observation")
          PY
