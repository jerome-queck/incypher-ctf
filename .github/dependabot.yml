# Weekly cadence argued org-side, kept here on its merits: one pull request per dependency, and a
# cooldown so a broken release is somebody else's discovery first. How a bump is landed once it
# is open is `docs/agents/dependencies.md`.
#
# Only `github-actions` is here because it is the only ecosystem this repository certainly has —
# the workflows in `.github/workflows/`. Add an ecosystem when the repository gains one, and mind
# two things about the entry you write.
#
# **`labels: []` is not optional.** Dependabot applies `dependencies` and a per-ecosystem label
# unless told not to, and this repository's label set is closed (`docs/agents/triage-labels.md`)
# — an ecosystem added without it grows labels outside the set that somebody then has to delete,
# and the next bump puts them back.
#
# **A missing `cooldown` is not zero.** The option's `default-days` has a minimum of 1, and an
# unconfigured ecosystem still takes Dependabot's own 3-day default for version updates.
#
# No `groups:` key, deliberately: a grouped pull request has to be judged by its worst member,
# and one-per-dependency names the culprit in the title when a bump breaks CI.
version: 2
updates:
  # The workflows pin every action to a commit (.github/workflows/ci.yml), which is safe but
  # frozen — Dependabot is what moves those pins forward. `directory: /` scans the
  # repository-root `.github/workflows` and nothing else.
  #
  # Note what it no longer carries: in the Organisation this ecosystem also bumped the pinned
  # call to the hub's conformance rules. Those rules are vendored into `conformance/` now
  # (ADR-0002), and Dependabot does not see them — an update there is a deliberate re-vendor.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # Labelling off, for the reason the header gives: the label set is closed, so a label
    # Dependabot applies is one somebody deletes and the next bump recreates. Empty is how the
    # option is switched off — omitting it is Dependabot's two defaults.
    labels: []
    # Already the default, stated because landing a bump depends on it: GitHub will not update a
    # pull request that has fallen behind `main`, and Dependabot rebasing its own pull requests
    # is the only thing that brings a stale bump back to mergeable.
    rebase-strategy: auto
    # Seven days on version updates; a security update is never held back by it.
    cooldown:
      default-days: 7
